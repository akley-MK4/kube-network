apiVersion: v1
kind: Pod
metadata:
  name: host-a-busybox-a
  annotations:
    k8s.v1.cni.cncf.io/networks: | 
      [
        {
          "name": "macvlan-enp4s0-2000-test",
          "ips": ["2.1.0.10/24"]
        },
        {
          "name": "macvlan-enp4s0-2001-test",
          "ips": ["2.1.1.10/24"]
        }
      ]   
spec:
  containers:
  - name: nginx-container
    image: busybox:1.36
    command: ["sh", "-c", "while true; do sleep 30; done"]
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
---
